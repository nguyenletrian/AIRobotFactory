name: Visual kinematics JS
on:
  push:
    paths: ['visualizer/**', '.github/workflows/visualizer.yml']
  pull_request:
    paths: ['visualizer/**', '.github/workflows/visualizer.yml']
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS tests
        run: node --test visualizer/*.test.cjs
      - name: JS syntax check
        run: node --check visualizer/kinematics.js
