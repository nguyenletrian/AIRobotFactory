name: One-click full virtual environment
on:
  pull_request:
  push:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: First run — install, test, simulate
        run: python scripts/bootstrap.py --headless
      - name: Second run — no new pip installs
        run: python scripts/bootstrap.py --headless --skip-install
      - name: Check virtual evidence and no hardware actions
        run: python -c "import json,pathlib; r=json.loads(pathlib.Path('artifacts/environment_report.json').read_text()); assert r['status']=='simulation_ready_headless' and not r['physical_actuation_enabled'] and not r['bridge_worker_modified']; print(r['workcell_report'])"
