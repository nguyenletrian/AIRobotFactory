[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airobotfactory"
version = "0.2.0"
description = "Simulation-first robotics manufacturing research foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.3,<4"]

[tool.setuptools.packages.find]
where = ["src"]
